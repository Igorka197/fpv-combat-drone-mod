name: Build FPV Combat Drone Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack mod sources and generate assets
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install pillow
          python3 setup_1.py
          python3 setup_2.py
          python3 setup_3.py
          python3 setup_4.py
          python3 setup_5.py
          python3 setup_6.py
          python3 -c 'import pathlib; [p.write_text(p.read_text().replace("\\n", "\n")) for ext in ("*.gradle","*.properties","*.toml","*.java","*.json","*.mcmeta") for p in pathlib.Path(".").rglob(ext) if "\\n" in p.read_text()]'
          python3 generate_assets.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Mod JAR
        run: gradle build --no-daemon

      - name: Upload Compiled Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: fpvdrone-1.20.1-forge-jar
          path: build/libs/*.jar

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 build/libs/*.jar --title "FPV Combat Drone v1.0.0" --notes "Minecraft 1.20.1 Forge 47.2.0+ (Requires GeckoLib 4.4.4+)" || gh release upload v1.0.0 build/libs/*.jar --clobber
