      - name: Generate textures and OGG audio
        run: |
          pip install pillow
          python3 generate_assets.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Mod JAR
        run: gradle build --no-daemon

      - name: Upload Compiled Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: fpvdrone-1.20.1-forge-jar
          path: build/libs/*.jar

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 build/libs/*.jar --title "FPV Combat Drone v1.0.0" --notes "Minecraft 1.20.1 Forge 47.2.0+ (Requires GeckoLib 4.4.4+)" || true
